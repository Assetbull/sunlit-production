<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="sunlit-green-dark" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#48A136" />
      <stop offset="45%" stop-color="#52C41A" />
      <stop offset="100%" stop-color="#8CE03E" />
    </linearGradient>
    <linearGradient id="sunlit-slate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Logomark (Hexagonal S) -->
  <g transform="translate(6, 5) scale(0.8)">
    <!-- Upper Loop -->
    <path
      d="M 50,6 L 88,28 L 88,48 L 50,70 L 32,59.5 L 43.5,52.5 L 50,56.5 L 74,42.5 L 74,36 L 50,22 L 26,36 L 26,45 L 12,37 L 12,28 Z"
      fill="url(#sunlit-slate-dark)"
    />
    <!-- Lower Loop -->
    <path
      d="M 50,94 L 12,72 L 12,52 L 50,30 L 68,40.5 L 56.5,47.5 L 50,43.5 L 26,57.5 L 26,64 L 50,78 L 74,64 L 74,55 L 88,63 L 88,72 Z"
      fill="url(#sunlit-green-dark)"
    />
  </g>

  <!-- Wordmark "SUNLIT" -->
  <text x="96" y="50" font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="1">
    <tspan fill="#FFFFFF">SUN</tspan><tspan fill="#52C41A">LIT</tspan>
  </text>

  <!-- Subtitle "ENERGY" -->
  <text x="98" y="74" font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" letter-spacing="9">
    ENERGY
  </text>
</svg>
