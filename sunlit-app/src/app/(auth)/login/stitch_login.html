<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .liquid-gradient {
            background: linear-gradient(180deg, #0f631b 0%, #2f7d32 100%);
        }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-floating-label:focus-within label,
        .input-floating-label input:not(:placeholder-shown) + label {

            color: #0f631b;

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#f9f9f8]/80 backdrop-blur-xl dark:bg-[#1a1c1c]/80 no-border bg-[#f3f4f3] dark:bg-[#252726] flat no-shadows">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#0f631b] dark:text-[#2f7d32]" style="font-variation-settings: 'FILL' 1;">solar_power</span>
<span class="text-2xl font-black tracking-tighter text-[#0f631b] dark:text-[#2f7d32] font-['Manrope']">SOLAR</span>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-[#5c5f5e] hover:opacity-80 transition-opacity active:scale-95 duration-200">help_outline</button>
</div>
</header>
<main class="w-full max-w-md mt-24 px-6 pb-32">
<!-- Hero Visual Section (Editorial/Asymmetric) -->
<div class="relative mb-12">
<div class="absolute -top-12 -right-4 w-40 h-40 bg-primary-fixed/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-8 -left-8 w-32 h-32 bg-secondary-container/30 rounded-full blur-2xl"></div>
<h1 class="font-display text-4xl font-extrabold tracking-tight text-on-surface leading-tight relative z-10">
                Welcome Back
            </h1>
<p class="text-on-surface-variant mt-2 font-medium tracking-tight">
                Manage your solar portfolio and track your energy impact.
            </p>
</div>
<!-- Layered Login Card -->
<div class="bg-surface-container-lowest rounded-3xl p-8 shadow-[0_32px_64px_-12px_rgba(15,99,27,0.08)] relative overflow-hidden">
<div class="space-y-6">
<!-- Email Input -->
<div class="relative input-floating-label">
<input class="peer w-full bg-surface-container-low border-none rounded-2xl px-4 pt-6 pb-2 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all" id="email" placeholder=" " type="email"/>
<label class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none origin-left" for="email">Email address</label>
<div class="hidden peer-focus:block mt-1 text-[11px] text-primary/70 px-1 font-semibold uppercase tracking-wider">Valid format required</div>
</div>
<!-- Password Input -->
<div class="relative input-floating-label">
<input class="peer w-full bg-surface-container-low border-none rounded-2xl px-4 pt-6 pb-2 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all" id="password" placeholder=" " type="password"/>
<label class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none origin-left" for="password">Password</label>
<div class="flex justify-between items-center mt-2 px-1">
<span class="hidden peer-focus:block text-[11px] text-primary/70 font-semibold uppercase tracking-wider">Minimum 8 characters</span>
<a class="text-sm font-semibold text-primary hover:opacity-80 transition-opacity ml-auto" href="#">Forgot password?</a>
</div>
</div>
<!-- OAuth Separator -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-surface-variant"></div>
<span class="text-xs font-bold text-on-surface-variant/50 uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-1 bg-surface-variant"></div>
</div>
<!-- OAuth Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-tertiary-fixed hover:bg-tertiary-fixed-dim transition-colors py-3 rounded-2xl font-semibold text-on-tertiary-fixed active:scale-95 duration-150">
<img alt="" class="w-5 h-5" data-alt="Official Google G logo in multicolored branding" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVcquMHpxhxFEz8zhjRJ-iaT2oFB9JQhUKN9LZ03v16Flfx31n575F660k7DRATIOsPCXEp5iY1UMJ20vfrboDyK6hP_V0q-1dHc7mjKZZEYnsrqdw8eBjxwkHoSFz5NyDYlDvyM0Je9s3pt02aia_oI1_4IGxivu0h3oMYblqMY5Qy7U10TV42wbP-0_ujL3-JpLYT5iiE90sNL5JdN_8xXI06d7yZm7TchmY8FGfmjlg5hFZg-B3hZ3esDKS6iVstA0sD6G3"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-on-background text-surface hover:opacity-90 transition-opacity py-3 rounded-2xl font-semibold active:scale-95 duration-150">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">ios</span>
<span>Apple</span>
</button>
</div>
</div>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-medium">
                Don't have an account? 
                <a class="text-primary font-bold ml-1 hover:underline" href="#">Register</a>
</p>
</div>
</main>
<!-- Sticky Primary Action -->
<div class="fixed bottom-0 left-0 w-full p-6 flex justify-center z-40">
<div class="w-full max-w-md bg-surface/80 backdrop-blur-md rounded-3xl p-2">
<button class="w-full liquid-gradient text-on-primary font-bold text-lg py-4 rounded-2xl shadow-xl shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform duration-150">
                Login
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<!-- Background Decoration Image (Editorial Style) -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-full overflow-hidden opacity-20 hidden md:block">
<img alt="" class="h-full object-cover" data-alt="Extreme close-up of blue solar panel crystalline texture with diagonal patterns and sunlight reflections" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBg2Wg9EC4utjoNTorpNwXu9xVueJKkIYQ8vAWudSM42In-RAvvfgF-Kx0LQxJLtcKE43mpL8C0CccLFTIBD-p2SbjdWAouEQ7XDVYP7XHyyFHm8i50ocJ7oM-esQqSndTNdT2EGVsZHxnJJWmdhBGSC4mBjjyNfp2EPARe85W-ex6vAUOoiTwbJhYIVVukl9EdST7erlwAUwrvVCP2-QrxoOla-l3iADjma_eAEU6m66IPB72A3vlUEXsSRgWtNT-8GbW8SVmn"/>
</div>
