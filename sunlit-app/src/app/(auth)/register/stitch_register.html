<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c1c",
                        "surface": "#f9f9f8",
                        "on-secondary-fixed": "#052106",
                        "tertiary-fixed-dim": "#d5c4ad",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#4c6a48",
                        "tertiary": "#605441",
                        "surface-bright": "#f9f9f8",
                        "on-tertiary-container": "#fff0dc",
                        "on-secondary-fixed-variant": "#314e2e",
                        "surface-variant": "#e2e2e2",
                        "primary-fixed": "#a3f69c",
                        "inverse-on-surface": "#f1f1f0",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#514533",
                        "surface-tint": "#1d6d24",
                        "on-tertiary-fixed": "#231a0b",
                        "on-primary-fixed": "#002203",
                        "surface-container-low": "#f3f4f3",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1c",
                        "surface-container-high": "#e8e8e7",
                        "tertiary-fixed": "#f2e0c8",
                        "primary-fixed-dim": "#88d982",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#88d982",
                        "on-error": "#ffffff",
                        "outline": "#707a6c",
                        "primary-container": "#2f7d32",
                        "on-primary-fixed-variant": "#005311",
                        "secondary-fixed-dim": "#aed0a6",
                        "tertiary-container": "#7a6c58",
                        "surface-dim": "#dadad9",
                        "on-tertiary": "#ffffff",
                        "background": "#f9f9f8",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-container": "#c6e9be",
                        "on-primary-container": "#ccffc2",
                        "primary": "#0f631b",
                        "outline-variant": "#bfcaba",
                        "on-surface-variant": "#40493d",
                        "inverse-surface": "#2f3130",
                        "secondary-fixed": "#c9ecc1",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eeeeed",
                        "secondary": "#486644"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .glass-panel {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface selection:bg-primary-fixed">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#f9f9f8]/80 backdrop-blur-xl dark:bg-[#1a1c1c]/80">
<div class="flex items-center gap-4">
<button class="text-[#0f631b] active:scale-95 duration-200 transition-opacity hover:opacity-80">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-2xl font-black tracking-tighter text-[#0f631b] dark:text-[#2f7d32] font-['Manrope']">SOLAR</span>
</div>
<div class="hidden md:flex items-center gap-8 text-[#5c5f5e] font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">
<span class="hover:text-[#0f631b] transition-colors cursor-pointer">Market</span>
<span class="hover:text-[#0f631b] transition-colors cursor-pointer">Impact</span>
<span class="hover:text-[#0f631b] transition-colors cursor-pointer">Wallet</span>
</div>
</header>
<main class="min-h-screen pt-24 pb-32 px-6 max-w-2xl mx-auto flex flex-col justify-center">
<!-- Content Header -->
<div class="mb-10 text-center md:text-left">
<h1 class="text-4xl md:text-5xl font-extrabold tracking-tighter text-on-surface mb-3 leading-tight">
                Create Your Account
            </h1>
<p class="text-tertiary font-body text-sm md:text-base max-w-md">
                Join the leading ecosystem for renewable energy professionals and property owners.
            </p>
</div>
<!-- Form Section with Surface Layering -->
<section class="space-y-6">
<!-- Basic Info Group -->
<div class="bg-surface-container-lowest p-8 rounded-3xl space-y-5 shadow-[0_8px_30px_rgb(15,99,27,0.02)]">
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Full Name</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all" placeholder="John Doe" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Email Address</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all" placeholder="john@company.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Phone Number</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">I am a...</label>
<div class="relative">
<select class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface appearance-none transition-all">
<option>Project Owner</option>
<option>Installer</option>
<option>EPC</option>
<option>Technician</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Password Group -->
<div class="bg-surface-container-low p-8 rounded-3xl space-y-5">
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Password</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Confirm Password</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-3 ml-1">
<input class="w-4 h-4 rounded text-primary border-none bg-surface-container-highest focus:ring-primary" type="checkbox"/>
<p class="text-xs text-tertiary">I agree to the <span class="text-primary font-semibold cursor-pointer">Terms of Service</span> and <span class="text-primary font-semibold cursor-pointer">Privacy Policy</span>.</p>
</div>
</div>
<!-- OAuth Options -->
<div class="pt-4 space-y-4">
<div class="flex items-center gap-4">
<div class="h-px flex-1 bg-outline-variant/30"></div>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-outline">Or continue with</span>
<div class="h-px flex-1 bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-highest hover:bg-surface-container-high py-4 rounded-2xl transition-colors active:scale-[0.98] duration-150">
<img alt="" class="w-5 h-5" data-alt="Official Google logo icon with clean vibrant colors on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiHKwGDKmpp36aw1bRckBPU5Z9L7ipzX7Fqii9XpDuavWPMu2E1-1N30UiPN9iOUbOZHahnIRlsvRYHH8nfOfXAzJEOLjfiDhxw-akvVXGWNBcNSDRUcnWraolP1M-zYTUgtUgHi2euf4Rs5VpbBpD8Ryula4GXg7IUw6HDoyAopV99kyErt-df93tXn2bXcOTCbHv62jnS0nL4rk3DT_MXr-yi0VHENI7hSiyhwZqDea7cunA1yuvRvCPFcR0ZcJVMowJ5TFL"/>
<span class="text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-highest hover:bg-surface-container-high py-4 rounded-2xl transition-colors active:scale-[0.98] duration-150">
<img alt="" class="w-5 h-5" data-alt="Minimalist solid black Apple logo on transparent background representing premium tech brand" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9_ePHrtYGiERVsT0iv8Rt4_PDCE5U5wLT7IQd86CZ3eDV5dqUS8Uxc2NGb93owv2Z73UBBJV7L4Ds997g1JkPxA0Hr3yUEs53tTCVSetQLlKVwgndw6R9Qn3yi_IWSoG1KF7rqahT9U-_ZuWwl5H3Z4T8_5vuCztMKqe3Kmv9Dje65kYwI8U8whgvLnZWZNaRU3xXuWZ03Lhfc3cPOeDpIaMRYtCSCyM7r2oCZe80CSk8lzoxXfv0lZdMKZvS9A2MWKJaVQzd"/>
<span class="text-sm font-semibold">Apple</span>
</button>
</div>
</div>
</section>
<!-- Footer Link -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant text-sm">
                Already have an account? 
                <a class="text-[#0f631b] font-bold hover:underline ml-1" href="#">Login</a>
</p>
</div>
</main>
<!-- Sticky Primary Action Button -->
<div class="fixed bottom-0 left-0 w-full p-6 glass-panel flex justify-center items-center z-40">
<div class="w-full max-w-2xl">
<button class="w-full py-4 rounded-3xl bg-gradient-to-b from-[#0f631b] to-[#2f7d32] text-white font-bold text-lg shadow-[0_16px_32px_rgba(15,99,27,0.15)] active:scale-[0.97] transition-all duration-200">
                Register
            </button>
</div>
</div>
<!-- Decorative Elements (Ambient Light) -->
<div class="fixed -top-24 -right-24 w-96 h-96 bg-[#a3f69c]/10 blur-[100px] rounded-full -z-10"></div>
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-[#f2e0c8]/20 blur-[100px] rounded-full -z-10"></div>
</body></html>
