sunlit_agent_governance:
  version: "1.0"
  status: "MANDATORY"
  priority: "CRITICAL"

  mission:
    - Preserve architecture integrity
    - Prevent codebase scattering
    - Prevent duplicate logic
    - Prevent duplicate files
    - Prevent destructive debugging
    - Enforce documentation-first execution
    - Ensure small fixes do not create systemic instability
    - Standardize sprint execution
    - Protect long-term maintainability
    - Enforce security-first engineering

  golden_rule:
    sequence:
      - READ
      - DISCOVER
      - UNDERSTAND
      - VALIDATE
      - CHECK_EXISTING
      - PATCH_MINIMALLY
      - TEST
      - DOCUMENT
    forbidden_sequence:
      - ASSUME
      - DUPLICATE
      - OVERWRITE
      - REBUILD
      - SCATTER

  mandatory_pre_execution:
    required_actions:
      - Scan project root
      - Read CLAUDE.md / GEMINI.md / AGENTS.md / requirements.md / BRD / PRD / TDD
      - Read architecture docs
      - Read workflow docs
      - Read API specs
      - Read DB schema
      - Read event specs
      - Read governance files
      - Discover real folder structure
      - Identify existing service/module responsible for target issue
      - Confirm bug source before editing
    fail_if:
      - Documentation ignored
      - Architecture not reviewed
      - Root cause not identified
      - Existing file not checked first

  file_creation_policy:
    strict_rule: "NEVER create a new file until confirming no existing file/service/module already handles the responsibility."
    
    before_new_file:
      required_checks:
        - Search by filename similarity
        - Search by service responsibility
        - Search by route/controller
        - Search by utility/helper
        - Search by component purpose
        - Search by domain ownership
        - Search by event ownership

    allowed_only_if:
      - No existing file handles responsibility
      - Existing structure cannot safely extend
      - New file aligns with architecture conventions
      - New file approved by project governance logic

    forbidden:
      - Duplicate helpers
      - Duplicate services
      - Duplicate auth logic
      - Duplicate payment logic
      - Duplicate workflow handlers
      - Shadow APIs
      - Parallel business logic
      - Random utility sprawl

    fail_if:
      - Duplicate functionality created
      - Existing module bypassed
      - Architecture fragmented

  patch_policy:
    objective: "Fix smallest stable layer possible"

    required:
      - Patch root cause
      - Preserve module boundaries
      - Preserve naming conventions
      - Preserve service contracts
      - Preserve RBAC
      - Preserve RLS
      - Preserve event contracts
      - Preserve schema integrity

    forbidden:
      - Refactor unrelated systems
      - Rename stable files without critical reason
      - Rewrite architecture for small issue
      - Broad code replacement
      - Temporary hacks in production paths
      - Hardcoded fixes

    fail_if:
      - One bug fix causes multiple regressions
      - Existing workflows break
      - Security weakens

  architecture_protection:
    must_preserve:
      - Folder structure
      - Domain boundaries
      - Frontend/backend separation
      - Service layer
      - Event system
      - Financial engine
      - Authentication system
      - Routing architecture
      - Shared contracts

    forbidden:
      - Business logic in UI
      - Payment logic in frontend
      - Auth bypass
      - Direct DB access from UI
      - Cross-domain shortcutting

  security_layer:
    zero_trust: true

    never_trust:
      - User input
      - Frontend role claims
      - Client payment state
      - URL params
      - Webhook without verification
      - Uploaded files
      - External callbacks without validation

    mandatory:
      - Input validation
      - Sanitization
      - Prepared statements
      - ORM safety
      - RBAC
      - RLS
      - CSRF protection
      - XSS prevention
      - Rate limiting
      - Audit logging
      - Idempotency
      - Secret isolation

    fail_if:
      - Unsafe query introduced
      - Validation bypassed
      - Auth weakened

  debugging_protocol:
    steps:
      - Reproduce issue
      - Trace source
      - Map impacted systems
      - Check dependencies
      - Check events
      - Check DB effects
      - Check auth implications
      - Patch minimally
      - Run regression suite
      - Update logs/docs

    forbidden:
      - Blind patching
      - Multi-system rewrites without necessity
      - Guess-based debugging

  sprint_execution_protocol:
    sprint_mode: "STRICT"

    before_sprint:
      - Review previous sprint changes
      - Review unresolved bugs
      - Review architecture debt
      - Review governance violations
      - Define exact scope
      - Lock unrelated systems

    during_sprint:
      - One issue class at a time
      - One domain at a time
      - No architecture drift
      - No duplicate modules
      - No undocumented changes

    after_sprint:
      - Regression test
      - Security review
      - Workflow validation
      - Event validation
      - Documentation update

  documentation_update_policy:
    mandatory_when:
      - New workflow added
      - Auth logic changes
      - API changes
      - DB changes
      - Event changes
      - Security changes
      - Governance changes

    update_targets:
      - BRD
      - PRD
      - TDD
      - API spec
      - DB schema
      - Event spec
      - Governance docs
      - Sprint notes

  agent_decision_framework:
    ask_before_action:
      - "Does this file already exist?"
      - "Does another service already handle this?"
      - "Am I duplicating logic?"
      - "Will this break architecture?"
      - "Can I patch smaller?"
      - "Does this preserve security?"
      - "Does this preserve workflows?"
      - "Does this create future confusion?"

    if_any_answer_is_risky:
      action: "STOP_AND_REVIEW"

  regression_lock:
    mandatory_test_areas:
      - Authentication
      - Role routing
      - RFQ
      - Bidding
      - Contract
      - Payment
      - Milestones
      - CrewLink
      - Notifications
      - Admin
      - Disputes
      - Ledger
      - Events

  output_standard:
    every_agent_must_report:
      - Files reviewed
      - Files modified
      - Why modified
      - Why existing files insufficient
      - Risks introduced
      - Tests run
      - Security checks
      - Regression checks

  emergency_stop_conditions:
    stop_immediately_if:
      - More than one unrelated subsystem affected
      - Duplicate file about to be created
      - Existing architecture unclear
      - Security implications uncertain
      - Auth flow uncertain
      - Financial logic uncertain
      - Schema risk detected

  final_directive:
    law:
      - Extend
      - Protect
      - Validate
      - Secure
      - Preserve
      - Document

    never:
      - Scatter
      - Duplicate
      - Guess
      - Overwrite
      - Rebuild blindly

