version: "1.0"
name: "Sunlit Energy Checklist System"
mode: "PRODUCTION_ENFORCEMENT_STRICT"

global_rules:
  - id: GR-001
    rule: "All checklist items are mandatory"
  - id: GR-002
    rule: "Each item must be verifiable (PASS/FAIL)"
  - id: GR-003
    rule: "Any failure blocks execution/deployment"
  - id: GR-004
    rule: "No assumptions allowed"
  - id: GR-005
    rule: "No skipped steps allowed"

checklists:

  - name: PRE_EXECUTION
    fail_on_any: true
    items:
      - id: PRE-001
        check: "Gemini.md parsed completely"
      - id: PRE-002
        check: "requirements.md parsed completely"
      - id: PRE-003
        check: "ace.yaml parsed completely"
      - id: PRE-004
        check: "user stories extracted"
      - id: PRE-005
        check: "escrow rules identified"
      - id: PRE-006
        check: "RBAC rules identified"
      - id: PRE-007
        check: "API contracts identified"
      - id: PRE-008
        check: "validation schemas identified"
      - id: PRE-009
        check: "workflow state machines understood"

  - name: ARCHITECTURE
    fail_on_any: true
    items:
      - id: ARC-001
        check: "Request flows through WAF → API Gateway → Auth → RBAC → Services → DB"
      - id: ARC-002
        check: "No direct frontend to DB communication"
      - id: ARC-003
        check: "API Gateway enforces validation and rate limiting"
      - id: ARC-004
        check: "JWT verified on every request"
      - id: ARC-005
        check: "RBAC enforced using internal DB roles"
      - id: ARC-006
        check: "Services separated from UI logic"
      - id: ARC-007
        check: "Event-driven architecture maintained"

  - name: RBAC_AUTH
    fail_on_any: true
    items:
      - id: RBAC-001
        check: "JWT validated server-side"
      - id: RBAC-002
        check: "User mapped to internal DB"
      - id: RBAC-003
        check: "Role fetched from internal DB"
      - id: RBAC-004
        check: "Role validated on every request"
      - id: RBAC-005
        check: "Unauthorized access blocked"
      - id: RBAC-006
        check: "Role changes require 2FA"
      - id: RBAC-007
        check: "Role changes logged"

  - name: INPUT_SECURITY
    fail_on_any: true
    items:
      - id: SEC-001
        check: "All inputs validated server-side"
      - id: SEC-002
        check: "Strict schema validation enforced"
      - id: SEC-003
        check: "Unknown fields rejected"
      - id: SEC-004
        check: "Inputs sanitized (XSS protection)"
      - id: SEC-005
        check: "Prepared statements used"
      - id: SEC-006
        check: "CSRF protection enabled"
      - id: SEC-007
        check: "Security headers enforced"

  - name: ESCROW_PAYMENT
    fail_on_any: true
    items:
      - id: PAY-001
        check: "Payment initialized via provider"
      - id: PAY-002
        check: "Webhook verified (HMAC signature)"
      - id: PAY-003
        check: "Idempotency key validated"
      - id: PAY-004
        check: "Duplicate transactions rejected"
      - id: PAY-005
        check: "Escrow state derived from rules"
      - id: PAY-006
        check: "dispute == TRUE → BLOCK"
      - id: PAY-007
        check: "milestone_complete == FALSE → HOLD"
      - id: PAY-008
        check: "approved == TRUE → RELEASE"
      - id: PAY-009
        check: "No manual override exists"
      - id: PAY-010
        check: "Transactions logged with correlation_id"

  - name: PROJECT_OWNER_WORKFLOW
    fail_on_any: true
    items:
      - id: PO-001
        check: "RFQ input validated"
      - id: PO-002
        check: "Location within Nigeria"
      - id: PO-003
        check: "timeline_end > timeline_start"
      - id: PO-004
        check: "Budget validated"
      - id: PO-005
        check: "RFQ stored"
      - id: PO-006
        check: "Matching engine triggered"
      - id: PO-007
        check: "Bids stored securely"
      - id: PO-008
        check: "Bid comparison working"
      - id: PO-009
        check: "Crew selection logged"
      - id: PO-010
        check: "Contract generated"
      - id: PO-011
        check: "Escrow funded"
      - id: PO-012
        check: "Tracking active"
      - id: PO-013
        check: "Review submitted"

  - name: INSTALLER_WORKFLOW
    fail_on_any: true
    items:
      - id: INS-001
        check: "Marketplace jobs visible"
      - id: INS-002
        check: "Filters working"
      - id: INS-003
        check: "Bid submission valid"
      - id: INS-004
        check: "Bid stored securely"
      - id: INS-005
        check: "Project tracking visible"
      - id: INS-006
        check: "Escrow payment received correctly"
      - id: INS-007
        check: "File upload secure"
      - id: INS-008
        check: "Ratings enabled"

  - name: CREWLINK
    fail_on_any: true
    items:
      - id: CL-001
        check: "Job feed loads"
      - id: CL-002
        check: "Advanced filters working"
      - id: CL-003
        check: "Bid visibility restricted"
      - id: CL-004
        check: "Comparison UI accurate"
      - id: CL-005
        check: "Realtime updates working"
      - id: CL-006
        check: "Tracking updates correctly"

  - name: MINI_GRID
    fail_on_any: true
    items:
      - id: MG-001
        check: "Portfolio data loaded"
      - id: MG-002
        check: "Site metrics accurate"
      - id: MG-003
        check: "Telemetry validated"
      - id: MG-004
        check: "Data normalized"
      - id: MG-005
        check: "Financial metrics correct"
      - id: MG-006
        check: "Regulatory data tracked"
      - id: MG-007
        check: "Procurement workflows active"
      - id: MG-008
        check: "Community metrics tracked"

  - name: ADMIN
    fail_on_any: true
    items:
      - id: ADM-001
        check: "System metrics accurate"
      - id: ADM-002
        check: "User management secured"
      - id: ADM-003
        check: "Role assignment restricted"
      - id: ADM-004
        check: "KYC workflow functional"
      - id: ADM-005
        check: "Dispute system enforces escrow"
      - id: ADM-006
        check: "Subscription management works"
      - id: ADM-007
        check: "Audit logs accessible"
      - id: ADM-008
        check: "Alerts active"

  - name: FILE_STORAGE
    fail_on_any: true
    items:
      - id: FS-001
        check: "Allowed file types only"
      - id: FS-002
        check: "MIME type validated"
      - id: FS-003
        check: "Magic bytes verified"
      - id: FS-004
        check: "File quarantined"
      - id: FS-005
        check: "Metadata validated"
      - id: FS-006
        check: "Virus scan completed"
      - id: FS-007
        check: "Stored in immutable storage"
      - id: FS-008
        check: "Suspicious files blocked"
      - id: FS-009
        check: "Presigned URLs used"

  - name: API_CONTRACT
    fail_on_any: true
    items:
      - id: API-001
        check: "Request matches schema"
      - id: API-002
        check: "Response matches contract"
      - id: API-003
        check: "No breaking changes"
      - id: API-004
        check: "Versioning respected"
      - id: API-005
        check: "Idempotency enforced"

  - name: REALTIME
    fail_on_any: true
    items:
      - id: RT-001
        check: "WebSocket connection established"
      - id: RT-002
        check: "Events emitted"
      - id: RT-003
        check: "Events received"
      - id: RT-004
        check: "UI updates correctly"
      - id: RT-005
        check: "Missed events replayed"

  - name: AUDIT_LOGGING
    fail_on_any: true
    items:
      - id: LOG-001
        check: "All actions logged"
      - id: LOG-002
        check: "Includes required fields"
      - id: LOG-003
        check: "Logs immutable"
      - id: LOG-004
        check: "Logs queryable"

  - name: PERFORMANCE
    fail_on_any: true
    items:
      - id: PERF-001
        check: "API response < 2s"
      - id: PERF-002
        check: "Queries optimized"
      - id: PERF-003
        check: "Pagination implemented"
      - id: PERF-004
        check: "Caching applied"
      - id: PERF-005
        check: "Lazy loading used"

  - name: DEBUG
    fail_on_any: true
    items:
      - id: DBG-001
        check: "Issue reproduced"
      - id: DBG-002
        check: "Request traced"
      - id: DBG-003
        check: "RBAC verified"
      - id: DBG-004
        check: "API contract validated"
      - id: DBG-005
        check: "DB verified"
      - id: DBG-006
        check: "Root cause identified"
      - id: DBG-007
        check: "Fix tested"
      - id: DBG-008
        check: "No regression"

  - name: SELF_HEALING
    fail_on_any: true
    items:
      - id: SH-001
        check: "Issue detected"
      - id: SH-002
        check: "Severity classified"
      - id: SH-003
        check: "Root cause traced"
      - id: SH-004
        check: "Confidence ≥ 95%"
      - id: SH-005
        check: "Safe fix applied"
      - id: SH-006
        check: "No escrow violation"
      - id: SH-007
        check: "Action logged"

  - name: DEPLOYMENT
    fail_on_any: true
    items:
      - id: DEP-001
        check: "All checklists passed"
      - id: DEP-002
        check: "Security tests passed"
      - id: DEP-003
        check: "Escrow flow tested"
      - id: DEP-004
        check: "RBAC tested"
      - id: DEP-005
        check: "Webhooks tested"
      - id: DEP-006
        check: "Logs verified"
      - id: DEP-007
        check: "No critical vulnerabilities"
      - id: DEP-008
        check: "CI/CD pipeline passed"

success_condition:
  rule: "ALL checklists must PASS"

failure_condition:
  rule: "ANY failed item blocks execution/deployment"
